<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F7F4">
<title>Piano Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
  --text-xs:12px;--text-sm:14px;--text-base:16px;--text-lg:18px;--text-xl:20px;--text-2xl:24px;--text-3xl:30px;--text-4xl:36px;--text-7xl:72px;
  --radius-md:8px;--radius-xl:16px;--radius-full:9999px;
  --color-bg:#F6F7F4;--color-surface:#FFFFFF;--color-text-primary:#1D2321;--color-text-secondary:#5C6663;--color-border:#DFE3DF;
  --color-right:#3B5BDB;--color-left:#E3A72F;--color-left-text:#8A5F00;--color-success:#2F9E6E;--color-danger:#D2443D;--color-felt:#B23A35;
  --font-ui:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-hand:"Caveat","Bradley Hand","Noteworthy","Segoe Print",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--color-bg);color:var(--color-text-primary);font:400 var(--text-base)/1.5 var(--font-ui);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--color-right);outline-offset:2px}
.btn{height:44px;padding:0 var(--space-4);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:600;line-height:1.2;white-space:nowrap;flex:none}
.btn.ghost{color:var(--color-text-secondary)}
.btn.ghost:active{background:var(--color-border)}
.btn.line{border:1px solid var(--color-border);background:var(--color-surface)}
.btn.solid{background:var(--color-text-primary);color:var(--color-bg)}
.btn.solid:active{transform:scale(.97)}
.btn.big{height:56px;padding:0 var(--space-6);font-size:var(--text-lg)}
.screen{height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.cR{color:var(--color-right);font-weight:600}
.cL{color:var(--color-left-text);font-weight:600}
.muted{color:var(--color-text-secondary);font-size:var(--text-sm)}

/* Accueil */
#home{overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:720px;margin:0 auto;padding:var(--space-5) var(--space-5) var(--space-8)}
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.brand{font-weight:700;font-size:var(--text-base)}
.status{display:flex;align-items:center;gap:var(--space-2);height:44px;font-size:var(--text-sm);color:var(--color-text-secondary);max-width:60%}
.status span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--color-danger);flex:none}
.status.ok .dot{background:var(--color-success)}
#hero{padding:var(--space-7) 0 var(--space-7)}
#hero .hello{font:500 var(--text-3xl)/1.1 var(--font-hand);color:var(--color-text-secondary);margin:0 0 var(--space-2)}
#hero h1{font-size:var(--text-4xl);line-height:1.1;letter-spacing:-.02em;font-weight:700;margin:0 0 var(--space-2)}
#hero p.d{font-size:var(--text-lg);color:var(--color-text-secondary);margin:0 0 var(--space-5);max-width:36em}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:var(--space-6) 0 var(--space-2)}
.sechead h2{font-size:var(--text-xl);line-height:1.2;font-weight:700;margin:0}
.sechead span{font-size:var(--text-sm);color:var(--color-text-secondary)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--color-border)}
.list li{display:flex;align-items:center;border-bottom:1px solid var(--color-border)}
.item{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-4);text-align:left;padding:var(--space-3) 0;min-height:64px}
.item:active{opacity:.6}
.item .num{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--color-border);display:flex;align-items:center;justify-content:center;font-size:var(--text-sm);font-weight:600;color:var(--color-text-secondary)}
.item.done .num{background:var(--color-text-primary);border-color:var(--color-text-primary);color:var(--color-bg)}
.item .tx{flex:1;min-width:0}
.item b{display:block;font-weight:600;line-height:1.3}
.item .d{display:block;font-size:var(--text-sm);color:var(--color-text-secondary);line-height:1.3}
.item .stars{flex:none;font-size:var(--text-sm);letter-spacing:2px;color:var(--color-left)}
.item .stars i{font-style:normal;color:var(--color-border)}
.del{width:44px;height:44px;color:var(--color-text-secondary);font-size:var(--text-sm);flex:none}

/* Lecteur */
#player{display:flex;flex-direction:column}
#bar{display:flex;gap:var(--space-1);align-items:center;padding:var(--space-2) var(--space-3)}
#title{font-weight:700;padding:0 var(--space-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.spacer{flex:1}
#stats{font-size:var(--text-sm);color:var(--color-text-secondary);white-space:nowrap;padding:0 var(--space-2);font-variant-numeric:tabular-nums}
#progress{height:16px;display:flex;align-items:center;cursor:pointer;padding:0 var(--space-4)}
#progress div.track{flex:1;height:4px;border-radius:2px;background:var(--color-border);overflow:hidden}
#progFill{height:100%;width:0;background:var(--color-text-primary)}
#stage{flex:1;position:relative;min-height:0}
#roll{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{position:absolute;top:var(--space-4);left:50%;transform:translateX(-50%);font:700 var(--text-3xl)/1.2 var(--font-hand);pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;padding:var(--space-1) var(--space-4);background:rgba(246,247,244,.86);border-radius:var(--radius-xl)}
#hint:empty{display:none}
#hint.big{font-size:var(--text-7xl);line-height:1;top:44%;transform:translate(-50%,-50%);padding:var(--space-2) var(--space-5)}
#hint .f{display:inline-flex;width:28px;height:28px;border-radius:50%;border:2px solid var(--color-text-primary);align-items:center;justify-content:center;font-size:var(--text-xl);margin-left:var(--space-1);vertical-align:3px;color:var(--color-text-primary);background:var(--color-surface)}
#hint .err{color:var(--color-danger)}
#startBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 8px 16px rgba(29,35,33,.16)}
#kb{width:100%;height:clamp(136px,28vh,240px);display:block;touch-action:none;flex:none}
#player.free .ctl{display:none}

/* Fenêtres */
.modal{position:fixed;inset:0;background:rgba(29,35,33,.4);display:flex;align-items:center;justify-content:center;z-index:10;padding:var(--space-5)}
.card{background:var(--color-surface);border-radius:var(--radius-xl);padding:var(--space-6);max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 16px 32px rgba(29,35,33,.16)}
.card h2{margin:0 0 var(--space-3);font-size:var(--text-2xl);line-height:1.2;letter-spacing:-.01em}
.card p,.card li{line-height:1.5;margin:0 0 var(--space-3)}
.card ol,.card ul{padding-left:var(--space-5);margin:0 0 var(--space-3)}
.card .step{font:500 var(--text-xl)/1.2 var(--font-hand);color:var(--color-text-secondary);margin:0 0 var(--space-1)}
.card .said{font:700 var(--text-3xl)/1.2 var(--font-hand);margin:0 0 var(--space-3)}
.card .starsBig{font-size:var(--text-3xl);line-height:1;letter-spacing:4px;color:var(--color-left);margin-bottom:var(--space-4)}
.card .starsBig i{font-style:normal;color:var(--color-border)}
.actions{display:flex;gap:var(--space-2);justify-content:flex-end;margin-top:var(--space-5);flex-wrap:wrap}
.opt{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);padding:var(--space-3) 0;border-top:1px solid var(--color-border);min-height:56px}
.opt small{display:block;color:var(--color-text-secondary);font-size:var(--text-sm);line-height:1.3}
.switch{flex:none;width:52px;height:32px;border-radius:var(--radius-full);background:var(--color-border);position:relative;transition:background .15s}
.switch i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--color-surface);transition:transform .15s;box-shadow:0 1px 2px rgba(29,35,33,.24)}
.switch.on{background:var(--color-text-primary)}
.switch.on i{transform:translateX(20px)}
.seg{display:flex;background:var(--color-bg);border-radius:var(--radius-full);padding:var(--space-1);margin-bottom:var(--space-2)}
.seg button{flex:1;height:40px;border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:600;color:var(--color-text-secondary)}
.seg button.on{background:var(--color-surface);color:var(--color-text-primary);box-shadow:0 1px 2px rgba(29,35,33,.16)}
.speed{display:flex;align-items:center;gap:var(--space-3)}
.speed input{width:160px;accent-color:var(--color-text-primary)}
.speed b{min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.tip{background:var(--color-bg);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin:0 0 var(--space-3)}
.fing{display:flex;gap:var(--space-2);flex-wrap:wrap;margin:0 0 var(--space-3)}
.fing span{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm)}
.fing i{display:inline-flex;width:28px;height:28px;border-radius:50%;border:2px solid var(--color-text-primary);align-items:center;justify-content:center;font:700 var(--text-xl)/1 var(--font-hand)}
@media (max-width:640px){#hero{padding:var(--space-6) 0}#hero h1{font-size:var(--text-3xl)}#restartBtn,#infoBtn{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="home" class="screen">
  <div class="wrap">
    <header class="top">
      <span class="brand">Piano Coach</span>
      <button class="status statusBtn"><span class="dot"></span><span class="statusTxt">Recherche du piano…</span></button>
    </header>
    <section id="hero"></section>
    <div class="sechead"><h2>Le parcours</h2><span id="pathTxt"></span></div>
    <ol class="list" id="lessons"></ol>
    <div class="sechead"><h2>À côté</h2></div>
    <ul class="list" id="extras"></ul>
    <div class="sechead"><h2>Tes morceaux</h2></div>
    <ul class="list" id="mine"></ul>
    <input type="file" id="fileIn" style="position:absolute;left:-9999px;opacity:0">
  </div>
</div>

<div id="player" class="screen hidden">
  <div id="bar">
    <button id="backBtn" class="btn ghost">Retour</button>
    <div id="title"></div>
    <div class="spacer"></div>
    <div id="stats" class="ctl"></div>
    <button id="infoBtn" class="btn ghost ctl">Consignes</button>
    <button id="restartBtn" class="btn ghost ctl">Recommencer</button>
    <button id="setBtn" class="btn ghost">Réglages</button>
    <button id="playBtn" class="btn line ctl hidden">Pause</button>
  </div>
  <div id="progress" class="ctl"><div class="track"><div id="progFill"></div></div></div>
  <main id="stage"><canvas id="roll"></canvas><div id="hint"></div><button id="startBtn" class="btn solid big">Commencer</button></main>
  <canvas id="kb"></canvas>
</div>

<div id="modal" class="modal hidden"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const NAMES = ['Do','Do#','Ré','Ré#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const isBlack = m => [1,3,6,8,10].includes(m % 12);
const noteName = m => NAMES[m % 12];
const C = {right:'#3B5BDB', left:'#E3A72F', auto:'#B9BEC0', good:'#2F9E6E', bad:'#D2443D', free:'#AEBBF5', ink:'#1D2321', felt:'#B23A35'};
const store = {
  get(k, d){ try{ const v = localStorage.getItem('pc_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('pc_' + k, JSON.stringify(v)); }catch(e){} }
};
function lowerBound(arr, x, key){ let lo = 0, hi = arr.length; while(lo < hi){ const mid = (lo + hi) >> 1; if(key(arr[mid]) < x) lo = mid + 1; else hi = mid; } return lo; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const starsOf = p => p >= 95 ? 3 : p >= 80 ? 2 : p >= 60 ? 1 : 0;

/* ================= Construction des morceaux ================= */
function finalizeSong(name, notes){
  notes.sort((a, b) => a.start - b.start || a.midi - b.midi);
  const off = notes.length ? notes[0].start : 0;
  let maxDur = 0, lo = 127, hi = 0, end = 0;
  notes.forEach(n => {
    n.start -= off;
    maxDur = Math.max(maxDur, n.dur); lo = Math.min(lo, n.midi); hi = Math.max(hi, n.midi); end = Math.max(end, n.start + n.dur);
  });
  return {name, notes, maxDur, lo, hi, duration: end};
}
// seq : [note ou [notes], durée en temps, doigt ou [doigts]]
function build(name, bpm, parts){
  const spb = 60 / bpm, notes = [];
  for(const p of parts){
    let b = p.start || 0;
    for(const [m, beats, f] of p.seq){
      const ms = m == null ? [] : Array.isArray(m) ? m : [m];
      ms.forEach((x, i) => notes.push({midi: x, start: b * spb, dur: beats * spb * 0.9, hand: p.hand, finger: Array.isArray(f) ? f[i] : f}));
      b += beats;
    }
  }
  return finalizeSong(name, notes);
}
const rep = (a, n = 2) => Array.from({length: n}, () => a).flat();
const FR = {60:1, 62:2, 64:3, 65:4, 67:5};             // main droite, pouce sur Do
const fr = seq => seq.map(([m, b]) => [m, b, FR[m]]);
const UP_R = [[60,1],[62,1],[64,1],[65,1],[67,1]], DOWN_R = [[65,1],[64,1],[62,1],[60,2]];
const UP_L = [[48,1,5],[50,1,4],[52,1,3],[53,1,2],[55,1,1]], DOWN_L = [[53,1,2],[52,1,3],[50,1,4],[48,2,5]];
const CLAIR = [[60,1],[60,1],[60,1],[62,1],[64,2],[62,2],[60,1],[64,1],[62,1],[62,1],[60,4]];
const TABAC_A = [[60,1],[62,1],[64,1],[60,1],[62,2],[62,1],[64,1],[65,2]];
const TABAC = [...TABAC_A,[65,2],[64,2],[64,2],...TABAC_A,[67,2],[60,4]];
const ODE_A = [[64,1],[64,1],[65,1],[67,1],[67,1],[65,1],[64,1],[62,1],[60,1],[60,1],[62,1],[64,1]];
const ODE_R = [...ODE_A,[64,1.5],[62,.5],[62,2],...ODE_A,[62,1.5],[60,.5],[60,2]];
const ODE_L = [[48,4,5],[55,4,1],[48,4,5],[55,4,1],[48,4,5],[55,4,1],[48,4,5],[55,2,1],[48,2,5]];
const FINGERS_HTML = `<div class="fing"><span><i>1</i>pouce</span><span><i>2</i>index</span><span><i>3</i>majeur</span><span><i>4</i>annulaire</span><span><i>5</i>petit doigt</span></div>`;

const LESSONS = [
  {id:'L1', name:'Trouver le Do', desc:'Se repérer sur le clavier grâce aux touches noires',
   intro:`<p>Regarde les touches noires : elles vont par groupes de <b>2</b> et de <b>3</b>.</p>
     <p>Le <b>Do</b> est la touche blanche juste <b>à gauche d'un groupe de 2 noires</b>. Il y en a plusieurs sur le clavier : celui du milieu s'appelle le <b>Do central</b> (à l'écran, il a un petit point bleu).</p>
     <div class="tip">À l'écran, la touche à jouer s'allume. Appuie dessus sur ton piano avec l'index, le morceau t'attend.</div>`,
   make:n => build(n, 60, [{hand:'R', seq:[[60,2,2],[60,2,2],[72,2,2],[60,2,2]]}, {hand:'L', start:8, seq:[[48,2,2],[48,2,2]]}, {hand:'R', start:12, seq:[[60,2,2],[72,4,2]]}])},
  {id:'L2', name:'Les 5 doigts – main droite', desc:'Do Ré Mi Fa Sol, un doigt par touche',
   intro:`<p>Chaque doigt a un numéro, affiché dans un rond blanc sur les notes :</p>${FINGERS_HTML}
     <p>Pose ton <b>pouce droit sur le Do central</b>, puis un doigt par touche blanche. Ta main ne bouge plus : seuls les doigts jouent.</p>
     <div class="tip">Garde les doigts arrondis, comme si tu tenais une balle.</div>`,
   make:n => build(n, 70, [{hand:'R', seq:fr([...UP_R,...DOWN_R,...UP_R,...DOWN_R])}])},
  {id:'L3', name:'Sauter des notes', desc:'Passer d\'un doigt à un autre sans regarder',
   intro:`<p>Même position (pouce droit sur le Do central), mais cette fois les notes ne se suivent plus : il faut <b>sauter une touche</b>.</p>
     <p>Fie-toi aux numéros de doigts : si c'est le <b>3</b>, c'est le majeur, où qu'il soit.</p>`,
   make:n => build(n, 70, [{hand:'R', seq:fr([[60,1],[64,1],[62,1],[65,1],[64,1],[67,1],[65,1],[62,1],[60,2],[60,1],[64,1],[67,1],[64,1],[60,2]])}])},
  {id:'L4', name:'Au clair de la lune', desc:'Ton premier morceau, avec 3 doigts',
   intro:`<p>Premier vrai morceau ! Il n'utilise que <b>Do, Ré et Mi</b> : pouce, index, majeur de la main droite.</p>
     <p>Les barres longues sont des notes à <b>tenir plus longtemps</b> : reste appuyé jusqu'à ce que la barre soit passée.</p>`,
   make:n => build(n, 90, [{hand:'R', seq:fr(rep(CLAIR))}])},
  {id:'L5', name:'J\'ai du bon tabac', desc:'Un morceau avec les 5 doigts',
   intro:`<p>Toujours la même position, pouce droit sur le Do central. Cette fois les cinq doigts travaillent.</p>
     <div class="tip">Si c'est trop rapide, baisse la vitesse dans Réglages.</div>`,
   make:n => build(n, 100, [{hand:'R', seq:fr(TABAC)}])},
  {id:'L6', name:'Ode à la joie', desc:'Beethoven, main droite seule',
   intro:`<p>Le thème le plus connu de Beethoven tient dans la position des 5 doigts. Tu commences avec le <b>majeur (3) sur Mi</b>.</p>
     <p>Une fois à l'aise en mode <b>Attente</b>, essaie le mode <b>Tempo réel</b> (dans Réglages) à 60 % : le morceau avance tout seul et tu dois suivre.</p>`,
   make:n => build(n, 100, [{hand:'R', seq:fr(ODE_R)}])},
  {id:'L7', name:'Les 5 doigts – main gauche', desc:'La main gauche, en orange',
   intro:`<p>Au tour de la main gauche, affichée en <span class="cL">orange</span>. Les numéros sont les mêmes (1 = pouce), mais en miroir.</p>
     <p>Pose ton <b>petit doigt gauche (5) sur le Do</b> situé à gauche du Do central, puis un doigt par touche. Ton pouce arrive sur le Sol.</p>`,
   make:n => build(n, 70, [{hand:'L', seq:[...UP_L,...DOWN_L,...UP_L,...DOWN_L]}])},
  {id:'L8', name:'Les deux mains ensemble', desc:'Jouer la même chose des deux mains',
   intro:`<p>Les deux mains jouent en même temps : <span class="cR">droite en bleu</span>, <span class="cL">gauche en orange</span>.</p>
     <p>Pouce droit sur le Do central, petit doigt gauche sur le Do d'en dessous. Le morceau attend que <b>les deux touches</b> soient jouées.</p>
     <div class="tip">Dans Réglages, tu peux couper une main pour travailler l'autre. Le piano joue la main coupée à ta place.</div>`,
   make:n => build(n, 60, [{hand:'R', seq:fr([...UP_R,...DOWN_R,...UP_R,...DOWN_R])}, {hand:'L', seq:[...UP_L,...DOWN_L,...UP_L,...DOWN_L]}])},
  {id:'L9', name:'Ode à la joie – deux mains', desc:'La mélodie à droite, des notes tenues à gauche',
   intro:`<p>Main droite : la mélodie que tu connais déjà. Main gauche : seulement deux notes longues, <b>Do (5)</b> et <b>Sol (1)</b>, à tenir pendant que la droite joue.</p>
     <div class="tip">Commence par la main gauche seule (coupe la main droite dans Réglages), puis remets les deux.</div>`,
   make:n => build(n, 90, [{hand:'R', seq:fr(ODE_R)}, {hand:'L', seq:ODE_L}])},
  {id:'L10', name:'Premier accord', desc:'Do majeur : trois notes à la fois',
   intro:`<p>Un <b>accord</b>, ce sont plusieurs notes jouées en même temps. Le plus célèbre : <b>Do majeur = Do + Mi + Sol</b>, avec les doigts 1, 3 et 5.</p>
     <p>Tu joues d'abord les trois notes l'une après l'autre, puis ensemble. À la fin, la main gauche ajoute un Do grave.</p>`,
   make:n => build(n, 70, [{hand:'R', seq:[[60,1,1],[64,1,3],[67,2,5],[60,1,1],[64,1,3],[67,2,5],...rep([[[60,64,67],2,[1,3,5]]],4)]}, {hand:'L', start:12, seq:[[48,2,5],[48,2,5]]}])},
  {id:'L11', name:'La gamme de Do', desc:'8 notes avec 5 doigts : le passage du pouce',
   intro:`<p>Pour monter les 8 notes de la gamme avec seulement 5 doigts, il y a une astuce : après le majeur (3) sur Mi, le <b>pouce passe en dessous</b> pour jouer le Fa.</p>

  const g = groups[groupIdx];
  const want = g ? g.filter(n => !n.hit) : [];
  const wantTxt = () => want.map(n => `<span class="${n.hand === 'R' ? 'cR' : 'cL'}">${label(n.midi)}</span>` + (opts.fingers && n.finger ? `<span class="f">${n.finger}</span>` : '')).join(' et ');
  if(playing && mode !== 'listen'){
    if(t < 0 && want.length) hint = 'Prépare-toi : ' + wantTxt();
    else if(waiting && want.length){
      if(lastErr && performance.now() - lastErr.at < 2200){
        const target = want.reduce((a, n) => Math.abs(n.midi - lastErr.m) < Math.abs(a.midi - lastErr.m) ? n : a, want[0]);
        hint = `<span class="err">Ça, c'est ${noteName(lastErr.m)}.</span> Le ${noteName(target.midi)} est plus à ${lastErr.m < target.midi ? 'droite' : 'gauche'}`;
      } else hint = wantTxt();
    }
  }
  setHTML('#hint', hint);
  const bad = stats.misses + stats.errors;
  setHTML('#stats', mode === 'listen' || !(stats.hits + bad) ? '' : plural(stats.hits, 'juste', 'justes') + (bad ? ', ' + plural(bad, 'erreur', 'erreurs') : ''));
}
function frame(ts){
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0; lastTs = ts;
  if(!$('#player').classList.contains('hidden')){ update(dt); drawRoll(); drawKb(); updateHUD(); }
  requestAnimationFrame(frame);
}

/* ================= Fenêtres ================= */
let modalActions = {};
function modal(html, actions){ modalActions = actions || {}; $('#card').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('click', e => {
  if(e.target.id === 'modal'){ closeModal(); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'close') closeModal(); else if(modalActions[a]) modalActions[a](b);
});
const starHTML = n => '★'.repeat(n) + '<i>' + '★'.repeat(3 - n) + '</i>';
function showIntro(){
  if(!item || !item.intro) return;
  const idx = LESSONS.indexOf(item);
  modal(`<p class="step">Leçon ${idx + 1} sur ${LESSONS.length}</p><h2>${esc(item.name)}</h2>${item.intro}
    <div class="actions"><button class="btn line" data-act="listen">Écouter d'abord</button><button class="btn solid" data-act="go">C'est parti</button></div>`, {
    go(){ closeModal(); setMode('wait'); restart(); if(!playing) togglePlay(); },
    listen(){ closeModal(); setMode('listen'); restart(); if(!playing) togglePlay(); }
  });
}
function showResults(){
  const pct = accuracy(), best = store.get('best', {});
  const isBest = pct > (best[item.id] || 0);
  if(isBest){ best[item.id] = pct; store.set('best', best); }
  const idx = LESSONS.indexOf(item), next = idx >= 0 ? LESSONS[idx + 1] : null;
  const said = pct >= 95 ? 'C\'est dans les doigts.' : pct >= 80 ? 'Très bien !' : pct >= 60 ? 'Pas mal du tout.' : 'On recommence tranquillement ?';
  const advice = pct >= 80 ? (mode === 'wait' ? 'Pour aller plus loin, rejoue-le en Tempo réel (dans Réglages) : le morceau ne t\'attend plus.' : 'Tu peux passer à la suite.')
    : pct >= 60 ? 'Refais-le une fois pour bien l\'ancrer.' : 'C\'est normal au début. Prends le mode Attente et laisse le morceau te guider.';
  const bad = stats.misses + stats.errors;
  modal(`<p class="step">${esc(song.name)}</p><p class="said">${said}</p><div class="starsBig">${starHTML(starsOf(pct))}</div>
    <p>${plural(stats.hits, 'note juste', 'notes justes')}${bad ? ' et ' + plural(bad, 'erreur', 'erreurs') : ', aucune erreur'}, soit ${pct} % de réussite${isBest && pct > 0 ? '. C\'est ton meilleur score' : ''}.</p>
    <p class="muted">${advice}</p>
    <div class="actions"><button class="btn ghost" data-act="home">Accueil</button><button class="btn ${next && pct >= 80 ? 'line' : 'solid'}" data-act="replay">Rejouer</button>${next ? `<button class="btn ${pct >= 80 ? 'solid' : 'line'}" data-act="next">Leçon suivante</button>` : ''}</div>`, {
    home(){ closeModal(); goHome(); },
    replay(){ closeModal(); restart(); togglePlay(); },
    next(){ closeModal(); openItem(next.id); }
  });
}
function showConnection(){
  const list = inputNames.length ? '<p>' + inputNames.map(n => `<b>${esc(n)}</b> est connecté.`).join('<br>') + '</p>' : '<p>Je ne vois pas encore ton piano.</p>';
  modal(`<h2>Ton piano</h2>${list}
    <ol>
      <li>Ferme complètement l'appli Roland, sinon elle garde le piano pour elle.</li>
      <li>Vérifie que le Bluetooth du piano est activé.</li>
      <li>Dans MIDIWeb Browser, connecte le piano depuis le menu Bluetooth MIDI (pas depuis les Réglages de l'iPad).</li>
      <li>Accepte l'accès MIDI si on te le demande, puis recharge la page.</li>
    </ol>
    <p class="muted">Si le Bluetooth ne passe pas, un câble USB entre la prise « USB Computer » du piano et l'iPad fonctionne aussi. Sans piano, tu peux jouer au doigt sur le clavier à l'écran.</p>
    <div class="actions"><button class="btn ghost" data-act="close">Fermer</button><button class="btn solid" data-act="reload">Recharger la page</button></div>`, {reload(){ location.reload(); }});
}
const MODES = {
  wait: ['Attente', 'Le morceau attend que tu joues la bonne touche. Le mieux pour apprendre.'],
  play: ['Tempo réel', 'Le morceau avance tout seul, à toi de suivre.'],
  listen: ['Écoute', 'Le piano joue le morceau pour que tu l\'entendes.']
};
function showSettings(){
  if(playing) togglePlay();
  const free = song && song.free;
  const tog = (act, k, on, title, d) => `<div class="opt"><div>${title}${d ? `<small>${d}</small>` : ''}</div><button class="switch ${on ? 'on' : ''}" role="switch" aria-checked="${on}" data-act="${act}" data-k="${k}"><i></i></button></div>`;
  const both = song && song.notes.some(n => n.hand === 'L') && song.notes.some(n => n.hand === 'R');
  const playPart = free ? '' : `
    <div class="seg">${Object.keys(MODES).map(k => `<button data-act="mode" data-k="${k}" data-mode="${k}" class="${k === mode ? 'on' : ''}">${MODES[k][0]}</button>`).join('')}</div>
    <p class="muted">${MODES[mode][1]}</p>
    <div class="opt"><div>Vitesse</div><div class="speed"><input type="range" id="speed" min="25" max="150" step="5" value="${Math.round(speed * 100)}"><b id="speedVal">${Math.round(speed * 100)} %</b></div></div>
    ${both && mode !== 'listen' ? tog('hand', 'R', hands.R, '<span class="cR">Main droite</span>', '') + tog('hand', 'L', hands.L, '<span class="cL">Main gauche</span>', 'Une main coupée est jouée par le piano') : ''}`;
  modal(`<h2>Réglages</h2>${playPart}
    ${tog('opt', 'names', opts.names, 'Noms des notes', 'Do, Ré, Mi sur les notes et les touches')}
    ${tog('opt', 'fingers', opts.fingers, 'Doigtés', 'Le doigt à utiliser, 1 pour le pouce')}
    ${tog('opt', 'full88', opts.full88, 'Clavier entier', 'Les 88 touches au lieu de la zone utile')}
    <div class="actions"><button class="btn solid" data-act="close">OK</button></div>`, {
    mode(b){ setMode(b.dataset.k); showSettings(); },
    hand(b){ const h = b.dataset.k; hands[h] = !hands[h]; allOff(); rebuild(); showSettings(); },
    opt(b){ const k = b.dataset.k; opts[k] = !opts[k]; store.set('opts', opts); computeRange(); showSettings(); }
  });
  const sp = $('#speed');
  if(sp) sp.addEventListener('input', e => { speed = e.target.value / 100; store.set('speed', +e.target.value); $('#speedVal').textContent = e.target.value + ' %'; });
}

/* ================= Accueil ================= */
function rowHTML(l, num, best, cls){
  const b = best[l.id] || 0;
  return `<li><button class="item ${cls || ''}" data-id="${l.id}"><span class="num">${num}</span><span class="tx"><b>${esc(l.name)}</b>${l.desc ? `<span class="d">${esc(l.desc)}</span>` : ''}</span>${b ? `<span class="stars" aria-label="${b} %">${starHTML(starsOf(b))}</span>` : ''}</button>${l.imported ? `<button class="del" data-del="${l.id}" aria-label="Supprimer ${esc(l.name)}">✕</button>` : ''}</li>`;
}
function renderHome(){
  const best = store.get('best', {});
  const isDone = l => (best[l.id] || 0) >= 80;
  const todo = LESSONS.find(l => !isDone(l)), nDone = LESSONS.filter(isDone).length;
  const h = new Date().getHours(), hello = h < 5 ? 'Bonsoir' : h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
  if(todo){
    const i = LESSONS.indexOf(todo), started = nDone > 0 || best[todo.id];
    $('#hero').innerHTML = `<p class="hello">${hello}. ${started ? 'On continue ?' : 'On commence par le début.'}</p>
      <h1>${esc(todo.name)}</h1><p class="d">${esc(todo.desc)}</p>
      <button class="btn solid big" data-id="${todo.id}">${best[todo.id] ? 'Reprendre' : 'Commencer'} la leçon ${i + 1}</button>`;
  } else {
    $('#hero').innerHTML = `<p class="hello">${hello}. Le parcours est terminé.</p><h1>À toi de jouer</h1>
      <p class="d">Rejoue ce que tu veux, ou ajoute un morceau en fichier MIDI un peu plus bas.</p>`;
  }
  $('#pathTxt').textContent = nDone ? nDone + ' sur ' + LESSONS.length : '';
  $('#lessons').innerHTML = LESSONS.map((l, i) => rowHTML(l, isDone(l) ? '✓' : i + 1, best, isDone(l) ? 'done' : '')).join('');
  $('#extras').innerHTML = EXTRAS.map(l => rowHTML(l, '♪', best)).join('');
  $('#mine').innerHTML = imported.map(s => rowHTML({id: s.id, name: s.name, imported: true}, '♪', best)).join('')
    + `<li><button class="item" id="importBtn"><span class="num">+</span><span class="tx"><b>Ajouter un fichier MIDI</b><span class="d">N'importe quel morceau au format .mid</span></span></button></li>`;
}
$('#home').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if(del){ imported = imported.filter(s => s.id !== del.dataset.del); store.set('imported', imported); renderHome(); return; }
  if(e.target.closest('#importBtn')){ $('#fileIn').click(); return; }
  const it = e.target.closest('[data-id]'); if(it){ audio(); openItem(it.dataset.id); }
});
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const buf = await f.arrayBuffer(), name = f.name.replace(/\.(mid|midi|kar)$/i, '');
    parseMidi(buf, name);
    const id = 'imp_' + Date.now();
    imported.push({id, name, b64: toB64(buf)});
    while(imported.length > 30) imported.shift();
    store.set('imported', imported); renderHome(); openItem(id);
  }catch(err){ modal(`<h2>Je n'arrive pas à lire ce fichier</h2><p>${esc(err.message || err)}</p><div class="actions"><button class="btn solid" data-act="close">OK</button></div>`); }
});
function openItem(id){
  const it = allItems().find(x => x.id === id); if(!it) return;
  let s;
  try{ s = it.free ? {name: it.name, notes: [], free: true, lo: 48, hi: 84, maxDur: 0, duration: 0} : it.make(it.name); }
  catch(e){ modal(`<h2>Je n'arrive pas à ouvrir ce morceau</h2><p>${esc(e.message)}</p><div class="actions"><button class="btn solid" data-act="close">OK</button></div>`); return; }
  item = it; song = s; playing = false; hands = {L: true, R: true};
  if(it.intro) mode = 'wait';
  $('#title').textContent = s.name;
  $('#player').classList.toggle('free', !!s.free);
  $('#infoBtn').classList.toggle('hidden', !it.intro);
  $('#home').classList.add('hidden'); $('#player').classList.remove('hidden');
  hud['#hint'] = hud['#stats'] = hud['#startBtn'] = null;
  resize(); computeRange(); restart(); updatePlayBtn();
  if(it.intro) showIntro();
}
function goHome(){
  playing = false; allOff(); pressed.clear();
  $('#player').classList.add('hidden'); $('#home').classList.remove('hidden'); renderHome();
}

/* ================= Commandes du lecteur ================= */
function updatePlayBtn(){ $('#playBtn').classList.toggle('hidden', !playing); }
let wakeLock = null;
async function keepAwake(){ try{ if(navigator.wakeLock && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } }catch(e){} }
function togglePlay(){
  if(!song || song.free) return;
  if(!playing){ if(t >= song.duration) restart(); playing = true; audio(); keepAwake(); }
  else { playing = false; allOff(); }
  updatePlayBtn();
}
function setMode(m){ mode = m; store.set('mode', m); allOff(); rebuild(); }
$('#playBtn').addEventListener('click', togglePlay);
$('#startBtn').addEventListener('click', togglePlay);
$('#restartBtn').addEventListener('click', () => { playing = false; updatePlayBtn(); restart(); });
$('#backBtn').addEventListener('click', goHome);
$('#infoBtn').addEventListener('click', () => { if(playing) togglePlay(); showIntro(); });
$('#setBtn').addEventListener('click', showSettings);
$$('.statusBtn').forEach(b => b.addEventListener('click', showConnection));
$('#progress').addEventListener('pointerdown', e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left - 16) / (r.width - 32)); });

// Clavier tactile
const touches = new Map();
function keyAt(x, y){
  if(y < FELT + (KH - FELT) * 0.62) for(let m = geo.klo; m <= geo.khi; m++){ const k = keys[m]; if(k.black && x >= k.x && x <= k.x + k.w) return m; }
  for(let m = geo.klo; m <= geo.khi; m++){ const k = keys[m]; if(!k.black && x >= k.x && x < k.x + k.w) return m; }
  return null;
}
const kbPos = e => { const r = kb.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
kb.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); try{ kb.setPointerCapture(e.pointerId); }catch(_){}
  const m = keyAt(...kbPos(e)); if(m != null){ touches.set(e.pointerId, m); noteOnInput(m, 90, 'touch'); }
});
kb.addEventListener('pointermove', e => {
  if(!touches.has(e.pointerId)) return;
  const m = keyAt(...kbPos(e)), old = touches.get(e.pointerId);
  if(m != null && m !== old){ noteOffInput(old, 'touch'); touches.set(e.pointerId, m); noteOnInput(m, 90, 'touch'); }
});
const endTouch = e => { const m = touches.get(e.pointerId); if(m != null){ noteOffInput(m, 'touch'); touches.delete(e.pointerId); } };
kb.addEventListener('pointerup', endTouch); kb.addEventListener('pointercancel', endTouch);

// Clavier d'ordinateur (touches physiques : rangée Q S D F G H J K en AZERTY = Do Ré Mi Fa Sol La Si Do)
const KEYMAP = {KeyA:0,KeyW:1,KeyS:2,KeyE:3,KeyD:4,KeyF:5,KeyT:6,KeyG:7,KeyY:8,KeyH:9,KeyU:10,KeyJ:11,KeyK:12,KeyO:13,KeyL:14};
const kbdHeld = new Set();
window.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || $('#player').classList.contains('hidden')) return;
  if(e.code === 'Space'){ e.preventDefault(); if(!e.repeat && $('#modal').classList.contains('hidden')) togglePlay(); return; }
  if(e.code in KEYMAP && !e.repeat && !e.metaKey && !e.ctrlKey){ audio(); const m = 60 + KEYMAP[e.code]; kbdHeld.add(m); noteOnInput(m, 90, 'kbd'); }
});
window.addEventListener('keyup', e => { if(e.code in KEYMAP){ const m = 60 + KEYMAP[e.code]; if(kbdHeld.delete(m)) noteOffInput(m, 'kbd'); } });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 300));
document.addEventListener('visibilitychange', () => { if(document.hidden && playing) togglePlay(); });

// Accès pour les tests automatiques
window.__pc = {noteOn: m => noteOnInput(m, 90, 'piano'), noteOff: m => noteOffInput(m, 'piano'), parseMidi, state: () => ({t, playing, waiting, mode, stats, want: (groups[groupIdx] || []).filter(n => !n.hit).map(n => n.midi), dur: song && song.duration})};

renderHome(); initMidi(); requestAnimationFrame(frame);
})();
</script>
</body>
